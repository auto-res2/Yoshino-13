[project]
name = "tracs_benchmark_suite"
version = "0.1.0"
description = "Refactored TRACS benchmark – smoke-test and full experiment runner"
requires-python = ">=3.9"

# Keep dependencies minimal; guard libraries are optional extras resolved by the user.
dependencies = [
    "torch>=1.9.0",
    "transformers>=4.35.0",
    "datasets>=2.10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.28.0",
    "accelerate>=0.28.0"  # required by newer versions of *transformers*
]
