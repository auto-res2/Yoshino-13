[project]
name = "oracle-experiments"
version = "0.1.0"
description = "Refactored ORACLE research experiments"
requires-python = ">=3.9"
dependencies = [
    # CPU-only wheels keep CI downloads small; avoids gigantic CUDA libs
    "torch==2.2.2+cpu",
    "torchvision==0.17.2+cpu",
    "torchaudio==2.2.2+cpu",
    "timm>=0.6.12",
    "transformers>=4.0.0",
    "datasets>=2.0.0",
    "matplotlib>=3.4.0",
    "requests>=2.0.0",
    "pyyaml>=6.0",
]
