experiment_name: full
experiments:
  # Only the leakage experiment is executed in the CI-friendly full run.
  - soic_leakage

hf_token_env: HF_TOKEN
num_seeds: 1  # CI-friendly – can be increased on real hardware
seed_list: [11]

resources:
  batch_size: 4
  max_prompts: 100  # bigger than smoke but still lightweight
  attacker_epochs: 3

datasets:
  secret_prompts:
    repo: synthetic://secret_prompts_large
  benign_prompts:
    repo: synthetic://benign_prompts_large

models:
  # Public, lightweight checkpoints so that no authentication is required
  base:
    repo: sshleifer/tiny-gpt2
  oracle_guard:
    repo: sshleifer/tiny-gpt2
  hyperion:
    repo: sshleifer/tiny-gpt2
  hyperion_no_hessian:
    repo: sshleifer/tiny-gpt2
  hyperion_no_dither:
    repo: sshleifer/tiny-gpt2
